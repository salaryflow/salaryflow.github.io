name: Audit reference data
# Scheduled source verification only; PRs use the fast offline workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * 1'
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate versioned data and fail-safe defaults
        run: python3 scripts/validate_reference_data.py
      - name: Compare official IRS published bulletin to saved 2026 reference
        run: node scripts/test-irs-live.mjs
      - name: Check published government source availability
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request
          root = pathlib.Path('data')
          manifest = json.loads((root / 'manifest.json').read_text())
          for kind in ('payroll', 'arizona'):
              name = manifest[kind]['path']
              record = json.loads(pathlib.Path(name).read_text())
              url = record['source']
              request = urllib.request.Request(url, headers={'User-Agent': 'SalaryFlowReferenceAudit/1.0'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      if response.status != 200:
                          raise RuntimeError(f'HTTP {response.status}')
                      print(f'{name}: official source reachable')
              except Exception as exc:
                  raise RuntimeError(f'{name}: government source unavailable: {exc}') from exc
          PY
      - name: Create or update failure issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Reference-data audit needs review';
            const {owner, repo} = context.repo;
            const url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `Scheduled source/validation audit failed. Check logs: ${url}. Do not publish new tax values without source verification. Existing static JSON and in-app fallback remain unchanged.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'open', per_page:100});
            const existing = issues.find(x => !x.pull_request && x.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner, repo, issue_number:existing.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }
